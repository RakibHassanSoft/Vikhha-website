# Netlify build settings for the Next.js frontend.
#
# This repository holds two apps, so in the Netlify UI set
#   Site configuration → Build & deploy → Package directory = frontend
# Netlify then reads this file and runs the build from this directory.
#
# The Next.js runtime (OpenNext adapter) installs itself automatically and
# should NOT be pinned — Netlify keeps it current with each Next.js release,
# so there is deliberately no [[plugins]] block here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Long-cache the immutable build output. Everything else is handled by the
# Next.js runtime, which knows which routes are static and which are rendered.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
